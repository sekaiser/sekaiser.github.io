<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="952" viewBox="0 0 1000 952" role="img" aria-labelledby="title description">
  <title id="title">Two results, three source reads</title>
  <desc id="description">A semantic trace of take(2), filter(even), enumerate, and an array source. Requests travel right toward the source; accepted items return left. The retained state is an output allowance, a predicate, an index, and a source cursor. Request one accepts 10 at position 0. Request two rejects 11 at position 1, then accepts 12 at position 2. Take now has zero outputs remaining, so its next request returns None without pulling 13 or 14. Specialized consumers may use a different literal call graph.</desc>
  <metadata id="trace-data">{"input":[10,11,12,13,14],"pulled":[10,11,12],"results":[[0,10],[2,12]],"unpulled":[13,14]}</metadata>
  <defs>
    <marker id="request-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 7 4 1 7" fill="none" stroke="#a05237" stroke-width="1.8" stroke-linejoin="round"/></marker>
    <marker id="item-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 7 4 1 7" fill="none" stroke="#3d5948" stroke-width="1.8" stroke-linejoin="round"/></marker>
    <style>
      text { font-family: Helvetica, Arial, sans-serif; fill: #273b32; }
      .muted { fill: #526157; }
      .code { font-family: Menlo, Consolas, monospace; }
      .label { font-size: 18px; }
      .value { font-size: 25px; }
    </style>
  </defs>
  <rect width="1000" height="952" fill="#fcfaf5"/>
  <text x="52" y="65" font-size="35" font-weight="700">Two results, three source reads</text>
  <text x="52" y="101" font-size="21" class="muted">One output request can ask the source more than once.</text>

  <text x="52" y="152" font-size="22" font-weight="700">State held between calls</text>
  <path d="M620 144H667" stroke="#a05237" stroke-width="2" marker-end="url(#request-arrow)"/>
  <text x="678" y="150" class="label muted">request</text>
  <path d="M840 144H793" stroke="#3d5948" stroke-width="2" marker-end="url(#item-arrow)"/>
  <text x="851" y="150" class="label muted">item</text>

  <g stroke="#cbd3c6" stroke-width="1.5" fill="#e5ebe2">
    <rect x="52" y="180" width="196" height="118" rx="7"/>
    <rect x="290" y="180" width="196" height="118" rx="7"/>
    <rect x="528" y="180" width="196" height="118" rx="7"/>
    <rect x="766" y="180" width="182" height="118" rx="7"/>
  </g>
  <g font-weight="700" font-size="24">
    <text x="72" y="216">take(2)</text>
    <text x="310" y="216">filter</text>
    <text x="548" y="216">enumerate</text>
    <text x="786" y="216">source</text>
  </g>
  <g class="label muted">
    <text x="72" y="246">remaining</text>
    <text x="310" y="246">predicate</text>
    <text x="548" y="246">next index</text>
    <text x="786" y="246">cursor</text>
  </g>
  <g font-size="21">
    <text x="72" y="278">2 → 1 → 0</text>
    <text x="310" y="278">even(value)</text>
    <text x="548" y="278">0 → 1 → 2 → 3</text>
    <text x="786" y="278">0 → 1 → 2 → 3</text>
  </g>
  <g fill="none" stroke-width="2">
    <path d="M254 213H282" stroke="#a05237" marker-end="url(#request-arrow)"/>
    <path d="M492 213H520" stroke="#a05237" marker-end="url(#request-arrow)"/>
    <path d="M730 213H758" stroke="#a05237" marker-end="url(#request-arrow)"/>
    <path d="M282 273H254" stroke="#3d5948" marker-end="url(#item-arrow)"/>
    <path d="M520 273H492" stroke="#3d5948" marker-end="url(#item-arrow)"/>
    <path d="M758 273H730" stroke="#3d5948" marker-end="url(#item-arrow)"/>
  </g>

  <text x="52" y="349" font-size="24" font-weight="700">Follow the two output requests</text>
  <g class="label muted">
    <text x="72" y="392">Request</text>
    <text x="230" y="392">Source</text>
    <text x="350" y="392">Enumerate</text>
    <text x="540" y="392">Filter</text>
    <text x="760" y="392">Returned item</text>
  </g>
  <rect x="52" y="410" width="896" height="88" rx="6" fill="#e5ebe2"/>
  <rect x="52" y="510" width="896" height="88" rx="6" fill="#f4e7dc"/>
  <rect x="52" y="610" width="896" height="88" rx="6" fill="#e5ebe2"/>
  <g font-size="20">
    <text x="72" y="446">First</text><text x="72" y="474" class="muted">request</text>
    <text x="72" y="546">Second</text><text x="72" y="574" class="muted">request</text>
    <text x="72" y="646">Same</text><text x="72" y="674" class="muted">request</text>
  </g>
  <g class="code value">
    <text x="230" y="464">10</text><text x="350" y="464">(0, 10)</text><text x="760" y="464">(0, 10)</text>
    <text x="230" y="564">11</text><text x="350" y="564">(1, 11)</text>
    <text x="230" y="664">12</text><text x="350" y="664">(2, 12)</text><text x="760" y="664">(2, 12)</text>
  </g>
  <g font-size="22">
    <text x="540" y="464">accept</text>
    <text x="540" y="550">reject</text>
    <text x="540" y="578" class="label muted">ask source again</text>
    <text x="760" y="564" class="label muted">no item yet</text>
    <text x="540" y="664">accept</text>
  </g>
  <text x="52" y="742" font-size="22">Two items returned; take has no outputs remaining.</text>

  <rect x="52" y="775" width="896" height="115" rx="7" fill="none" stroke="#cbd3c6" stroke-width="1.5"/>
  <text x="76" y="814" font-size="24" font-weight="700">The next request stops at take</text>
  <text x="76" y="849" font-size="21" class="muted">It returns None without pulling another source value.</text>
  <g fill="#fcfaf5" stroke="#cbd3c6" stroke-width="1.5">
    <rect x="770" y="792" width="65" height="49" rx="5"/>
    <rect x="849" y="792" width="65" height="49" rx="5"/>
  </g>
  <g class="code value muted"><text x="786" y="825">13</text><text x="865" y="825">14</text></g>
  <text x="776" y="868" class="label muted">still unread</text>
  <text x="52" y="929" font-size="18" class="muted">Semantic trace of this example, not a literal optimized call graph.</text>
</svg>
