<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="780" viewBox="0 0 1000 780" role="img" aria-labelledby="title description">
<title id="title">Recorded is not the same as visible</title><desc id="description">A journal is published through record 10000 while its projection represents every record through 9700. The 300-record suffix remains to be replayed. The view reports as_of_sequence 9700 even if one device last changed at 9200. A read-your-writes API would wait until indexed reaches the requested sequence; that live API is proposed, not implemented by the benchmark.</desc>

<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#3d5948" stroke-width="1.7"/></marker></defs>
<style>
text{font-family:Helvetica,Arial,sans-serif;fill:#273b32}
.title{font-size:31px;font-weight:600}.heading{font-size:27px;font-weight:600}
.body{font-size:24px}.label{font-size:24px;font-weight:600}
.small{font-size:21px;fill:#526157}.code{font-family:Menlo,Consolas,monospace;font-size:23px}
.rule{fill:none;stroke:#cbd3c6;stroke-width:1.3}
.arrow{fill:none;stroke:#3d5948;stroke-width:2.2;marker-end:url(#arrow)}
.work{fill:#e5ebe2;stroke:#3d5948;stroke-width:1.4}
.plain{fill:#fcfaf5;stroke:#3d5948;stroke-width:1.4}
.ack{fill:#f4e7dc;stroke:#a05237;stroke-width:1.6}
.pending{fill:#f4e7dc;stroke:#a05237;stroke-width:1.4}
.clay{fill:#a05237}.green{fill:#3d5948}
</style>
<rect width="1000" height="780" fill="#fcfaf5"/>
<text x="40" y="55" class="title" text-anchor="start" >Recorded is not the same as visible</text><text x="40" y="94" class="small" text-anchor="start" >Illustrative journal positions. The segment widths are not to scale.</text><path d="M40 120L960 120" class="rule" />
<text x="40" y="180" class="heading" text-anchor="start" >Applied prefix</text><text x="960" y="180" class="heading" text-anchor="end" >Pending replay</text><rect x="40" y="208" width="580" height="100" class="work"/><rect x="620" y="208" width="340" height="100" class="pending"/><text x="330" y="250" class="label" text-anchor="middle" >Every record through 9,700</text><text x="330" y="284" class="small" text-anchor="middle" >represented in the table</text><text x="790" y="250" class="label" text-anchor="middle" >9,701 ... 10,000</text><text x="790" y="284" class="small" text-anchor="middle" >300 records of lag</text><path d="M620 195L620 334" class="rule" style="stroke:#3d5948;stroke-width:2.2"/><text x="620" y="366" class="code" text-anchor="end" >indexed = 9,700</text><text x="960" y="366" class="code" text-anchor="end" >head = 10,000</text><rect x="40" y="407" width="920" height="83" rx="5" class="plain"/><text x="70" y="458" class="code" text-anchor="start" >Read response:  value + as_of_sequence = 9,700</text><text x="40" y="548" class="heading" text-anchor="start" >A device may not change in every batch.</text><rect x="40" y="577" width="440" height="87" rx="5" class="work"/><text x="260" y="610" class="label" text-anchor="middle" >Device last changed</text><text x="260" y="639" class="small" text-anchor="middle" >record 9,200 (illustrative)</text><rect x="520" y="577" width="440" height="87" rx="5" class="work"/><text x="740" y="610" class="label" text-anchor="middle" >View covers the journal</text><text x="740" y="639" class="small" text-anchor="middle" >through record 9,700</text><text x="40" y="717" class="code" text-anchor="start" >Read-your-writes waits for indexed &gt;= required_sequence.</text><text x="40" y="754" class="small" text-anchor="start" >The live freshness API is a service-design requirement, not a measured harness feature.</text>
</svg>
