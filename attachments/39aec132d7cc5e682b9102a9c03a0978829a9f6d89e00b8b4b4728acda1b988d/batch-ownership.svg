<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="940" viewBox="0 0 1000 940" role="img" aria-labelledby="title description">
<title id="title">The allocation needs an owner</title><desc id="description">The shown Go function copies integer records to a second backing array before sending; the caller retains its original allocation and may reuse it after the function returns. The Rust function moves its vector and existing backing allocation to the receiver without cloning; the caller cannot reuse the moved vector. Neither send proves processing is complete. Both languages can implement a pool and a buffer-return protocol. These teaching functions are separate from the measured replay worker.</desc>

<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#3d5948" stroke-width="1.7"/></marker></defs>
<style>
text{font-family:Helvetica,Arial,sans-serif;fill:#273b32}
.title{font-size:31px;font-weight:600}.heading{font-size:27px;font-weight:600}
.body{font-size:24px}.label{font-size:24px;font-weight:600}
.small{font-size:21px;fill:#526157}.code{font-family:Menlo,Consolas,monospace;font-size:23px}
.rule{fill:none;stroke:#cbd3c6;stroke-width:1.3}
.arrow{fill:none;stroke:#3d5948;stroke-width:2.2;marker-end:url(#arrow)}
.work{fill:#e5ebe2;stroke:#3d5948;stroke-width:1.4}
.plain{fill:#fcfaf5;stroke:#3d5948;stroke-width:1.4}
.ack{fill:#f4e7dc;stroke:#a05237;stroke-width:1.6}
.pending{fill:#f4e7dc;stroke:#a05237;stroke-width:1.4}
.clay{fill:#a05237}.green{fill:#3d5948}
</style>
<rect width="1000" height="940" fill="#fcfaf5"/>
<text x="40" y="55" class="title" text-anchor="start" >The allocation needs an owner</text><text x="40" y="94" class="small" text-anchor="start" >The two shown handoff functions make different promises to their callers.</text><path d="M40 120L960 120" class="rule" />
<text x="40" y="169" class="heading" text-anchor="start" >Go example: retain the original, send a copy</text><rect x="40" y="207" width="190" height="88" rx="5" class="plain"/><text x="135" y="259" class="label" text-anchor="middle" >Caller</text><rect x="300" y="207" width="290" height="88" rx="5" class="work"/><text x="445" y="237" class="small" text-anchor="middle" >Original allocation</text><rect x="314" y="250" width="84" height="32" fill="#fcfaf5" stroke="#cbd3c6"/><text x="356" y="273" class="code" text-anchor="middle" >r1</text><rect x="403" y="250" width="84" height="32" fill="#fcfaf5" stroke="#cbd3c6"/><text x="445" y="273" class="code" text-anchor="middle" >r2</text><rect x="492" y="250" width="84" height="32" fill="#fcfaf5" stroke="#cbd3c6"/><text x="534" y="273" class="code" text-anchor="middle" >r3</text><path d="M230 251H300" class="arrow" /><rect x="300" y="355" width="290" height="88" rx="5" class="pending"/><text x="445" y="385" class="small" text-anchor="middle" >Independent copy</text><rect x="314" y="398" width="84" height="32" fill="#fcfaf5" stroke="#cbd3c6"/><text x="356" y="421" class="code" text-anchor="middle" >r1</text><rect x="403" y="398" width="84" height="32" fill="#fcfaf5" stroke="#cbd3c6"/><text x="445" y="421" class="code" text-anchor="middle" >r2</text><rect x="492" y="398" width="84" height="32" fill="#fcfaf5" stroke="#cbd3c6"/><text x="534" y="421" class="code" text-anchor="middle" >r3</text><rect x="760" y="355" width="200" height="88" rx="5" class="plain"/><text x="860" y="407" class="label" text-anchor="middle" >Receiver</text><path d="M445 295V355" class="arrow" /><text x="468" y="335" class="label" text-anchor="start" >Copy</text><path d="M590 399H760" class="arrow" /><text x="40" y="324" class="small" text-anchor="start" >Retains original</text><text x="40" y="354" class="small" text-anchor="start" >after return</text><text x="40" y="490" class="small" text-anchor="start" >Two backing arrays; the records here contain only integers.</text><path d="M40 522L960 522" class="rule" /><text x="40" y="574" class="heading" text-anchor="start" >Rust example: transfer the existing allocation</text><rect x="40" y="623" width="190" height="88" rx="5" class="plain"/><text x="135" y="675" class="label" text-anchor="middle" >Caller</text><rect x="300" y="623" width="290" height="88" rx="5" class="work"/><text x="445" y="653" class="small" text-anchor="middle" >Same allocation</text><rect x="314" y="666" width="84" height="32" fill="#fcfaf5" stroke="#cbd3c6"/><text x="356" y="689" class="code" text-anchor="middle" >r1</text><rect x="403" y="666" width="84" height="32" fill="#fcfaf5" stroke="#cbd3c6"/><text x="445" y="689" class="code" text-anchor="middle" >r2</text><rect x="492" y="666" width="84" height="32" fill="#fcfaf5" stroke="#cbd3c6"/><text x="534" y="689" class="code" text-anchor="middle" >r3</text><rect x="760" y="623" width="200" height="88" rx="5" class="plain"/><text x="860" y="675" class="label" text-anchor="middle" >Receiver</text><path d="M230 667H300" class="arrow" stroke-dasharray="5 4"/><path d="M258 653L276 681M276 653L258 681" stroke="#a05237" stroke-width="2.5"/><path d="M760 667H590" class="arrow" /><text x="674" y="642" class="label" text-anchor="middle" >Owns</text><text x="40" y="758" class="small" text-anchor="start" >The caller cannot reuse the moved Vec. No payload clone occurs.</text><text x="40" y="827" class="body" text-anchor="start" >Reusing storage still needs a return protocol in either language.</text><text x="40" y="907" class="small" text-anchor="start" >These are teaching examples, not measured journal policies. Sending is not completion.</text>
</svg>
