<svg xmlns="http://www.w3.org/2000/svg" width="320" height="224" viewBox="0 0 320 224">
  <title>Org to Markdown to a web page</title>
  <desc>The publishing path used by this showcase: ox-hugo exports Org to Markdown, then Berlin renders the web page.</desc>
  <rect width="320" height="224" rx="4" fill="#e9edde"/>
  <g fill="none" stroke="#849579" stroke-width="1">
    <path d="M24 39H296M24 193H296"/>
    <path d="M95 106H122M198 106H225" stroke="#a4593b" stroke-width="2"/>
    <path d="m117 101 5 5-5 5m103-10 5 5-5 5" stroke="#a4593b" stroke-width="2"/>
  </g>
  <text x="24" y="27" fill="#53684c" font-family="sans-serif" font-size="12" letter-spacing="1.4">FROM BUFFER TO BROWSER</text>
  <g fill="#fcf9f0" stroke="#899c7d" stroke-width="1.5">
    <rect x="24" y="65" width="70" height="84" rx="3"/>
    <rect x="124" y="65" width="72" height="84" rx="3"/>
    <rect x="226" y="65" width="70" height="84" rx="3"/>
  </g>
  <g font-family="monospace" fill="#36513d" font-size="15">
    <text x="35" y="88">* Note</text>
    <text x="136" y="88"># Note</text>
  </g>
  <g fill="none" stroke="#8f9d80" stroke-width="2">
    <path d="M36 100H81M43 110H81M43 120H72M36 132H81M136 100H184M136 110H173M136 122H184M136 132H172"/>
    <path d="M237 92H285M237 105H285M237 114H277M237 131H258M237 123H285"/>
  </g>
  <path d="M227 76H295" stroke="#899c7d"/>
  <g fill="#a4593b"><circle cx="235" cy="71" r="1.5"/><circle cx="241" cy="71" r="1.5"/><circle cx="247" cy="71" r="1.5"/></g>
  <g fill="#273b32" font-family="Georgia,serif" font-size="17" text-anchor="middle">
    <text x="59" y="175">Org</text><text x="160" y="175">Markdown</text><text x="261" y="175">Web</text>
  </g>
  <text x="160" y="212" text-anchor="middle" fill="#53684c" font-family="sans-serif" font-size="12">ox-hugo → Berlin</text>
</svg>
