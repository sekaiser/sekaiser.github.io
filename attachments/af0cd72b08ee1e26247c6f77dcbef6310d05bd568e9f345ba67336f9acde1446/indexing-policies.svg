<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1030" viewBox="0 0 1000 1030" role="img" aria-labelledby="title description">
<title id="title">Three places to pay for a lookup</title><desc id="description">All three policies append and synchronize the same records. Journal-only acknowledges and scans on a later query. Eager indexing updates the table before acknowledging. Background indexing publishes a completed journal position, after which acknowledgement and replay may proceed independently. The worker rereads, validates and updates the table. A query may need to await progress. Admission can delay the next append when the lag budget binds. This is a schematic, not a performance comparison.</desc>

<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#3d5948" stroke-width="1.7"/></marker></defs>
<style>
text{font-family:Helvetica,Arial,sans-serif;fill:#273b32}
.title{font-size:31px;font-weight:600}.heading{font-size:27px;font-weight:600}
.body{font-size:24px}.label{font-size:24px;font-weight:600}
.small{font-size:21px;fill:#526157}.code{font-family:Menlo,Consolas,monospace;font-size:23px}
.rule{fill:none;stroke:#cbd3c6;stroke-width:1.3}
.arrow{fill:none;stroke:#3d5948;stroke-width:2.2;marker-end:url(#arrow)}
.work{fill:#e5ebe2;stroke:#3d5948;stroke-width:1.4}
.plain{fill:#fcfaf5;stroke:#3d5948;stroke-width:1.4}
.ack{fill:#f4e7dc;stroke:#a05237;stroke-width:1.6}
.pending{fill:#f4e7dc;stroke:#a05237;stroke-width:1.4}
.clay{fill:#a05237}.green{fill:#3d5948}
</style>
<rect width="1000" height="1030" fill="#fcfaf5"/>
<text x="40" y="55" class="title" text-anchor="start" >Three places to pay for a lookup</text><text x="40" y="94" class="small" text-anchor="start" >The arrows show dependencies, not elapsed time.</text><path d="M40 120L960 120" class="rule" />
<text x="40" y="169" class="heading" text-anchor="start" >Journal only</text><rect x="40" y="190" width="180" height="80" rx="5" class="work"/><text x="130" y="238" class="label" text-anchor="middle" >Append</text><rect x="270" y="190" width="180" height="80" rx="5" class="work"/><text x="360" y="238" class="label" text-anchor="middle" >Sync</text><rect x="500" y="190" width="180" height="80" rx="5" class="ack"/><text x="590" y="238" class="label" text-anchor="middle" >Acknowledge</text><path d="M220 230H270" class="arrow" /><path d="M450 230H500" class="arrow" /><text x="40" y="319" class="label" text-anchor="start" >On lookup</text><text x="270" y="319" class="body" text-anchor="start" >Scan the captured journal prefix.</text><path d="M40 358L960 358" class="rule" /><text x="40" y="408" class="heading" text-anchor="start" >Eager projection</text><rect x="40" y="430" width="180" height="80" rx="5" class="work"/><text x="130" y="478" class="label" text-anchor="middle" >Append</text><rect x="270" y="430" width="180" height="80" rx="5" class="work"/><text x="360" y="478" class="label" text-anchor="middle" >Sync</text><rect x="500" y="430" width="220" height="80" rx="5" class="work"/><text x="610" y="478" class="label" text-anchor="middle" >Update table</text><rect x="770" y="430" width="190" height="80" rx="5" class="ack"/><text x="865" y="478" class="label" text-anchor="middle" >Acknowledge</text><path d="M220 470H270" class="arrow" /><path d="M450 470H500" class="arrow" /><path d="M720 470H770" class="arrow" /><text x="40" y="559" class="label" text-anchor="start" >On lookup</text><text x="270" y="559" class="body" text-anchor="start" >Read the updated table.</text><path d="M40 598L960 598" class="rule" /><text x="40" y="648" class="heading" text-anchor="start" >Background projection</text><rect x="40" y="680" width="180" height="80" rx="5" class="work"/><text x="130" y="728" class="label" text-anchor="middle" >Append</text><rect x="270" y="680" width="180" height="80" rx="5" class="work"/><text x="360" y="728" class="label" text-anchor="middle" >Sync</text><rect x="500" y="680" width="210" height="80" rx="5" class="work"/><text x="605" y="728" class="label" text-anchor="middle" >Publish head</text><rect x="780" y="680" width="180" height="80" rx="5" class="ack"/><text x="870" y="728" class="label" text-anchor="middle" >Acknowledge</text><path d="M220 720H270" class="arrow" /><path d="M450 720H500" class="arrow" /><path d="M710 720H780" class="arrow" /><circle cx="745" cy="720" r="4" fill="#3d5948"/><path d="M745 720V806H610V835" class="arrow" /><rect x="270" y="835" width="690" height="76" rx="5" class="work"/><text x="615" y="881" class="label" text-anchor="middle" >Replay journal, validate, update table</text><text x="40" y="812" class="label" text-anchor="start" >Worker</text><text x="40" y="956" class="label" text-anchor="start" >On lookup</text><text x="270" y="956" class="body" text-anchor="start" >Read the table; await progress if required.</text><text x="40" y="1000" class="small" text-anchor="start" >Background admission can wait before the next append when the lag budget binds.</text>
</svg>
